name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - Vinicios
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and tests
        run: |
          npm run typecheck
          npm test

      - name: Verify backend URL configuration
        run: |
          api_url="$(sed -n 's/^VITE_API_URL=//p' .env.production)"
          if [[ "$api_url" != https://* ]]; then
            echo "::error::VITE_API_URL must be the HTTPS base URL of the published backend."
            exit 1
          fi

      - name: Build site
        env:
          VITE_MP_PUBLIC_KEY: ${{ vars.VITE_MP_PUBLIC_KEY }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
